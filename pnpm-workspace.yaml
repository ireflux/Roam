packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 构建脚本审批策略（allowBuilds 取代了 v10 的 onlyBuiltDependencies）
# 仅审批四个知名工具链包：esbuild 二进制校验、core-js 捐赠提示、sharp/unrs-resolver 原生绑定
allowBuilds:
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true

# 原生单例模块强制单版本：reanimated/worklets 双实例会直接崩溃，
# 且版本必须与 Expo SDK 57 的 C++ 接口匹配（worklets 0.12 移除了 executeSync）
overrides:
  react-native-reanimated: 4.5.1
  react-native-worklets: 0.10.1
  react-native-gesture-handler: ~2.32.0
