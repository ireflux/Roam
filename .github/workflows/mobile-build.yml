name: Mobile Build

# 纯 GitHub Actions 构建，不依赖任何外部服务账号。
# - Android APK：ubuntu runner 自带 Android SDK，直接 Gradle 构建；
#   未配置正式 keystore 时自动回退 debug 签名（侧载安装可用，上架前需换正式证书）。
# - 可选仓库变量：Settings → Secrets and variables → Actions → Variables 标签页添加
#     API_BASE_URL       App 内置的服务端地址（缺省回退 https://roam-web.vercel.app）
#     AMAP_ANDROID_KEY   高德 Android key（绑定 io.github.ireflux.roam 包名 + 证书 SHA1）

on:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle 任务（assembleDebug=调试包 assembleRelease=发布签名包 bundleRelease=AAB 商店格式）
        type: choice
        options: [assembleDebug, assembleRelease, bundleRelease]
        default: assembleRelease

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Generate native project (CNG prebuild)
        working-directory: apps/mobile
        env:
          AMAP_ANDROID_KEY: ${{ vars.AMAP_ANDROID_KEY }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: pnpm exec expo prebuild -p android --no-install
      - name: Gradle build
        working-directory: apps/mobile/android
        env:
          # JS 打包阶段（Metro）需要读取以注入 __env 内联常量
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: ./gradlew ${{ inputs.task }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: roam-android-${{ inputs.task }}
          path: apps/mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
